<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cubes Paradox icon options</title>
<link rel="stylesheet" href="../../www/fonts.css">
<style>
  html, body { margin: 0; background: #14170D; font-family: Rubik, system-ui, sans-serif; color: #EEF0E2; }
  /* ?opt=A (one icon, 1024×1024, full bleed) or no opt: the comparison sheet */
  .sheet { width: 1600px; height: 700px; box-sizing: border-box; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px; }
  .sheet h1 { margin: 0; font-size: 38px; font-weight: 800; }
  .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .big { width: 300px; height: 300px; border-radius: 68px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  .small { display: flex; align-items: center; gap: 16px; background: #272B1A; border-radius: 20px; padding: 12px 18px; }
  .small div { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; }
  .small div.sq { border-radius: 16px; }
  .small span { font-size: 14px; color: #CDD1BE; }
  .opt b { font-size: 24px; }
  .opt p { margin: -8px 0 0; font-size: 16px; color: #A9AE98; text-align: center; }
  svg { display: block; width: 100%; height: 100%; }
  .solo { width: 1024px; height: 1024px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const C = { olive: '#88994E', oliveD: '#4E5A26', floor: '#30361F', coral: '#FF7A59', coralD: '#C9553A', amber: '#F5B83D', amberD: '#B9851F', teal: '#4FB9A0', tealD: '#2E7E6B', tealF: '#173D35', violet: '#9B8CFF', violetD: '#6F62C9', violetF: '#28224A', ink: '#16180F' };
  // the same soft light the rooms have in the game: bright top-left, darker bottom-right
  const DEFS = `<defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFEB" stop-opacity=".3"/><stop offset=".5" stop-color="#FFFFEB" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>`;
  const BG = `<g><rect width="1024" height="1024" fill="${C.olive}"/><rect width="1024" height="1024" fill="url(#sheen)"/></g>`;
  const rect = (x, y, s, r, fill) => `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${r}" fill="${fill}"/>`;

  // the hero: coral block with a lip, a soft highlight and eyes
  function hero(x, y, s, look) {
    const lip = s * 0.08, r = s * 0.28;
    const [dx, dy] = look || [0.05, 0];
    let out = rect(x, y + lip, s, r, C.coralD) + rect(x, y, s, r, C.coral) + rect(x, y, s, r, 'url(#gloss)');
    for (const ex of [0.33, 0.67]) {
      out += `<circle cx="${x + s * ex}" cy="${y + s * 0.46}" r="${s * 0.125}" fill="#fff"/>`;
      out += `<circle cx="${x + s * (ex + dx)}" cy="${y + s * (0.46 + dy)}" r="${s * 0.06}" fill="${C.ink}"/>`;
    }
    return out;
  }
  function box(x, y, s) {
    const lip = s * 0.08, r = s * 0.2;
    return rect(x, y + lip, s, r, C.amberD) + rect(x, y, s, r, C.amber) + rect(x, y, s, r, 'url(#gloss)') +
      `<rect x="${x + s * 0.25}" y="${y + s * 0.25}" width="${s * 0.5}" height="${s * 0.5}" rx="${s * 0.1}" fill="none" stroke="rgba(18,20,28,.18)" stroke-width="${s * 0.05}"/>`;
  }

  /* A · The room: a carved corridor like a real level, the hero about to push a box */
  function iconA() {
    return BG +
      `<path d="M 262 300 H 762 V 520 H 400 V 760" fill="none" stroke="${C.floor}" stroke-width="176" stroke-linecap="round" stroke-linejoin="round"/>` +
      hero(190, 228, 150, [0.05, 0]) + box(520, 226, 150) +
      `<rect x="340" y="704" width="120" height="120" rx="26" fill="none" stroke="rgba(238,240,226,.8)" stroke-width="12" stroke-dasharray="26 20"/>`;
  }

  /* B · Box in a box: the game's idea in one look */
  function iconB() {
    return BG + rect(192, 192, 640, 120, C.floor) +
      rect(322, 338, 380, 76, C.tealD) + rect(322, 322, 380, 76, C.teal) + rect(322, 322, 380, 76, 'url(#sheen)') +
      rect(380, 380, 264, 52, C.tealF) + hero(432, 426, 160, [0.05, 0]);
  }

  /* C · Doorway: the hero standing in a gap in the olive wall, about to walk in */
  function iconC() {
    return BG +
      `<path d="M 232 1024 V 400 a 140 140 0 0 1 140 -140 H 652 a 140 140 0 0 1 140 140 V 1024 Z" fill="${C.floor}"/>` +
      hero(342, 470, 340, [0.03, -0.03]);
  }

  /* D · Endless: a room holding a room holding a room */
  function iconD() {
    const colors = [[C.olive, C.floor], [C.teal, C.tealF], [C.violet, C.violetF], [C.amber, '#3A2C08'], [C.teal, C.tealF]];
    function room(x, y, s, d) {
      let out = '';
      if (d > 0) {
        out += rect(x, y + s * 0.05, s, s * 0.18, 'rgba(0,0,0,.35)');
        out += rect(x, y, s, s * 0.18, colors[d][0]);
      }
      out += rect(x + s * 0.11, y + s * 0.11, s * 0.78, s * 0.12, colors[d][1]);
      if (d < colors.length - 1) out += room(x + s * 0.36, y + s * 0.36, s * 0.47, d + 1);
      return out;
    }
    return BG + room(62, 62, 900, 0) + hero(205, 205, 200, [0.05, 0]);
  }

  const ICONS = { A: iconA, B: iconB, C: iconC, D: iconD };
  const NAMES = { A: ['The Room', 'A carved corridor, just like a level'], B: ['Box in a Box', 'The whole idea, simple and bold'], C: ['Doorway', 'The hero stepping into the wall'], D: ['Endless', 'A room in a room in a room'] };
  const svg = (id) => `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${DEFS}${ICONS[id]()}</svg>`;

  const q = new URLSearchParams(location.search);
  const opt = q.get('opt');
  const root = document.getElementById('root');
  if (opt) {
    // ?layer=fg drops the background (adaptive icon foreground), ?layer=bg keeps only it;
    // ?scale=0.78 shrinks the artwork into Android's adaptive-icon safe zone
    const layer = q.get('layer') || 'full', scale = +(q.get('scale') || 1);
    const art = ICONS[opt]().slice(BG.length);
    const scaled = `<g transform="translate(512 512) scale(${scale}) translate(-512 -512)">${art}</g>`;
    const body = layer === 'bg' ? BG : layer === 'fg' ? scaled : BG + scaled;
    document.documentElement.style.background = document.body.style.background = 'transparent';
    root.className = 'solo';
    root.innerHTML = `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${DEFS}${body}</svg>`;
  } else {
    root.innerHTML = '<div class="sheet"><h1>Pick an icon</h1><div class="row">' + Object.keys(ICONS).map((id) =>
      `<div class="opt"><div class="big">${svg(id)}</div>
        <div class="small"><div>${svg(id)}</div><div class="sq">${svg(id)}</div><span>phone size</span></div>
        <b>${id} · ${NAMES[id][0]}</b><p>${NAMES[id][1]}</p></div>`).join('') + '</div></div>';
  }
</script>
</body>
</html>
