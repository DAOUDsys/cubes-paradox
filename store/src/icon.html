<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cubes Paradox icon</title>
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<!-- ?layer=full (icon with background), fg (foreground only, transparent), bg (background only) -->
<svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <g id="bg">
    <rect width="1024" height="1024" fill="#9B8CFF"/>
  </g>
  <g id="fg">
    <!-- amber box with its lip -->
    <rect x="232" y="252" width="560" height="560" rx="132" fill="#C38E22"/>
    <rect x="232" y="222" width="560" height="560" rx="132" fill="#F5B83D"/>
    <!-- teal room-box -->
    <rect x="336" y="342" width="352" height="352" rx="92" fill="#2A9C88"/>
    <rect x="336" y="320" width="352" height="352" rx="92" fill="#3CC9B0"/>
    <!-- the player -->
    <rect x="435" y="429" width="154" height="154" rx="46" fill="#C9553A"/>
    <rect x="435" y="415" width="154" height="154" rx="46" fill="#FF7A59"/>
    <rect x="473" y="463" width="24" height="40" rx="12" fill="#12141C"/>
    <rect x="527" y="463" width="24" height="40" rx="12" fill="#12141C"/>
  </g>
</svg>
<script>
  const layer = new URLSearchParams(location.search).get('layer') || 'full';
  if (layer === 'fg') document.getElementById('bg').remove();
  if (layer === 'bg') document.getElementById('fg').remove();
</script>
</body>
</html>
