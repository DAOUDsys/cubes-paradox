<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cubes Paradox feature graphic</title>
<link rel="stylesheet" href="../../www/fonts.css">
<style>
  /* 1024×500 store banner */
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #12141C; font-family: Rubik, system-ui, sans-serif; color: #ECEEF5; }
  .wrap { position: relative; width: 1024px; height: 500px; overflow: hidden; display: flex; align-items: center; gap: 56px; padding: 0 72px; box-sizing: border-box; }
  .icon { width: 280px; height: 280px; border-radius: 64px; flex: none; box-shadow: 0 24px 48px rgba(0,0,0,.45); }
  .text { display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
  h1 span { color: #F5B83D; }
  p { margin: 0; font-size: 28px; color: #B9BED0; line-height: 1.35; }
  .chips { display: flex; gap: 10px; margin-top: 10px; }
  .chip { padding: 9px 16px; border-radius: 14px; background: #1C1F2B; font-size: 19px; font-weight: 500; }
  .deco { position: absolute; border-radius: 22px; opacity: .5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="deco" style="width:120px;height:120px;right:-30px;top:-34px;background:#3CC9B0;transform:rotate(12deg)"></div>
  <div class="deco" style="width:86px;height:86px;right:80px;bottom:-30px;background:#9B8CFF;transform:rotate(-10deg)"></div>
  <img class="icon" src="../../assets/icon-only.png" alt="">
  <div class="text">
    <h1>Cubes <span>Paradox</span></h1>
    <p>Push boxes. Walk inside them.<br>Find your way back out.</p>
    <div class="chips"><span class="chip">350 levels</span><span class="chip">18 worlds</span><span class="chip">Offline</span></div>
  </div>
</div>
</body>
</html>
