<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C1F12">
<title>Cubes Paradox</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MAIN -->
<section id="main" class="screen">
  <div class="main-top">
    <span id="main-progress" class="muted"></span>
    <div class="top-end">
      <span class="coins"><span class="star" aria-hidden="true">★</span><b id="main-stars">0</b></span>
      <span class="coins"><span class="coin" aria-hidden="true"></span><b class="coin-count">0</b></span>
      <button id="open-achievements" class="icon-btn" data-t-label="achievements">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      </button>
      <button id="open-settings" class="icon-btn" data-t-label="settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="main-hero">
    <div class="logo" aria-hidden="true"></div>
    <h1 class="brand" data-t="brand"></h1>
    <p class="muted tagline" data-t="tagline"></p>
  </div>
  <div class="main-actions">
    <button id="daily-card" class="daily-card">
      <span class="daily-room" aria-hidden="true"><span></span></span>
      <span class="daily-text"><b data-t="daily"></b><small id="daily-state"></small></span>
      <span id="daily-streak" class="daily-streak"></span>
    </button>
    <button id="main-play" class="btn-primary"><span id="main-play-label"></span><span id="main-play-level" class="small"></span></button>
    <button id="main-levels" class="btn-secondary" data-t="levels"></button>
  </div>
</section>

<!-- LEVELS -->
<section id="levels" class="screen">
  <header class="row">
    <button id="levels-back" class="icon-btn" data-t-label="back">
      <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1 class="h1" data-t="levels"></h1>
    <span class="coins push-end"><span class="coin" aria-hidden="true"></span><b class="coin-count">0</b></span>
  </header>
  <div id="level-list" class="level-list"></div>
</section>

<!-- WORLD -->
<section id="world" class="screen">
  <header class="row">
    <button id="world-back" class="icon-btn" data-t-label="back">
      <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1 id="world-title" class="h1"></h1>
  </header>
  <p id="world-desc" class="muted world-desc"></p>
  <div class="bar"><div id="world-bar"></div></div>
  <div id="world-grid" class="world-grid"></div>
  <button id="world-play" class="btn-primary center"></button>
</section>

<!-- ACHIEVEMENTS -->
<section id="achievements" class="screen">
  <header class="row">
    <button id="achievements-back" class="icon-btn" data-t-label="back">
      <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1 class="h1" data-t="achievements"></h1>
    <span id="ach-count" class="muted push-end"></span>
  </header>
  <div id="ach-list" class="ach-list"></div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <header class="topbar">
    <button id="play-back" class="icon-btn" data-t-label="backLevels">
      <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="title"><span id="play-sub" class="muted"></span><span id="play-name">—</span></div>
    <div class="moves" aria-live="polite"><b id="moves">0</b><span data-t="moves"></span></div>
  </header>
  <div class="chips">
    <div class="chip here" data-t-label="where"><span id="here-dot" class="dot"></span><span id="here-name" class="here-name"></span><span id="depth" class="depth" hidden></span></div>
    <div class="chip goals">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9AE98" stroke-width="2" stroke-dasharray="3 3" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>
      <span><b id="goals">0 / 0</b></span>
    </div>
    <div class="chip"><span class="coin" aria-hidden="true"></span><b class="coin-count">0</b></div>
  </div>
  <div id="board-wrap" class="board-wrap"><canvas id="board" role="img" data-t-label="board"></canvas></div>
  <div class="info">
    <div id="legend" class="legend"></div>
    <div id="inside" class="inside" hidden>
      <div class="mm-card"><span class="muted" data-t="outside"></span><canvas id="mini" aria-hidden="true"></canvas></div>
      <div class="inside-text"><b id="inside-title"></b><p id="inside-msg"></p></div>
    </div>
  </div>
  <div class="spacer"></div>
  <p id="hint" class="hint" aria-live="polite"></p>
  <div class="controls">
    <button id="undo" class="ctrl">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-5-5 5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span data-t="undo"></span>
    </button>
    <button id="restart" class="ctrl">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span data-t="restart"></span>
    </button>
    <button id="hint-btn" class="ctrl">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>
      <span><span data-t="hint"></span> <small id="hint-cost" class="cost"></small></span>
    </button>
    <button id="skip-btn" class="ctrl">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="flip" d="M5 5l8 7-8 7z"/><path class="flip" d="M18 5v14"/></svg>
      <span><span data-t="skip"></span> <small id="skip-cost" class="cost"></small></span>
    </button>
  </div>
</section>

<!-- SETTINGS -->
<section id="settings" class="screen">
  <header class="row">
    <button id="settings-back" class="icon-btn" data-t-label="back">
      <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1 class="h1" data-t="settings"></h1>
  </header>
  <div class="set-list">
    <button id="set-sound" class="set-row" role="switch" aria-checked="true">
      <span class="set-label"><span data-t="sound"></span><small id="set-sound-state" class="muted"></small></span>
      <span class="switch" aria-hidden="true"><span></span></span>
    </button>
    <button id="set-vibrate" class="set-row" role="switch" aria-checked="true">
      <span class="set-label"><span data-t="vibration"></span><small id="set-vibrate-state" class="muted"></small></span>
      <span class="switch" aria-hidden="true"><span></span></span>
    </button>
    <div class="set-row static lang-row">
      <span class="set-label"><span data-t="language"></span></span>
      <div id="lang-list" class="lang-grid" role="group" data-t-label="language"></div>
    </div>
  </div>
</section>

<!-- WIN -->
<section id="win" class="screen">
  <div></div>
  <div class="win-hero">
    <div class="win-badge" aria-hidden="true"><div>
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
    </div></div>
    <h1 class="brand" data-t="solved"></h1>
    <p id="win-stars" class="win-stars"></p>
    <p id="win-par" class="muted"></p>
    <p id="win-sub" class="muted tagline"></p>
    <p id="win-earned" class="earned"></p>
    <div class="stats">
      <div><b id="win-moves">0</b><span data-t="moves"></span></div>
      <div><b id="win-undos">0</b><span data-t="undos"></span></div>
      <div><b id="win-depth">0</b><span data-t="deepest"></span></div>
    </div>
  </div>
  <div class="main-actions">
    <button id="win-next" class="btn-primary center"></button>
    <div class="row2">
      <button id="win-again" class="btn-secondary" data-t="replay"></button>
      <button id="win-levels" class="btn-secondary" data-t="levels"></button>
    </div>
  </div>
</section>

<!-- HINTS -->
<div id="hint-sheet" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hint-sheet-title">
    <p id="hint-sheet-title" data-t="hintChoose"></p>
    <button id="hint-idea" class="hint-opt"><span><b data-t="hintIdea"></b><small data-t="hintIdeaSub"></small></span><span class="cost-pill"><span class="coin" aria-hidden="true"></span><span id="hint-idea-cost"></span></span></button>
    <button id="hint-moves" class="hint-opt"><span><b data-t="hintMoves"></b><small data-t="hintMovesSub"></small></span><span class="cost-pill"><span class="coin" aria-hidden="true"></span><span id="hint-moves-cost"></span></span></button>
    <button id="hint-close" class="btn-secondary" data-t="cancel"></button>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden><b></b><span></span></div>

<!-- CONFIRM -->
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-text">
    <p id="modal-text"></p>
    <div class="row2">
      <button id="modal-no" class="btn-secondary" data-t="cancel"></button>
      <button id="modal-yes" class="btn-primary center"></button>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/i18n-langs.js"></script>
<script src="js/sfx.js"></script>
<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/daily.js"></script>
<script src="js/render.js"></script>
<script src="js/planets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
